name: Sync DomInNATEly Music Tab

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Optional: Can also be triggered via repository_dispatch from the DomInNATEly repo
  repository_dispatch:
    types: [dominnately-updated]

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest DomInNATEly files
        run: |
          chmod +x scripts/sync-dominnately.sh
          ./scripts/sync-dominnately.sh

      - name: Check for changes
        id: git-check
        run: |
          git status -s
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.git-check.outputs.changes_detected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & test build
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          npm ci || npm install
          npm run build

      - name: Commit and push changes
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/music-gallery public/assets/images
          git commit -m "chore(music): auto-sync latest tracks & updates from DomInNATEly"
          git push
